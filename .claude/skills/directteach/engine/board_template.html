<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <!-- MathJax Configuration -->
    <script>
        MathJax = {
            tex: { inlineMath: [['\\(', '\\)'], ['$', '$']], displayMath: [['\\[', '\\]']] }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root {
            --primary: #1a365d;
            --secondary: #2b6cb0;
            --accent: #e2e8f0;
            --text-main: #2d3748;
            --bg-color: #cbd5e0;
            --badge-concept: #3182ce;
            --badge-activity: #38a169;
            --badge-question: #dd6b20;
            --badge-exit: #805ad5;
            --badge-hook: #d69e2e;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            overflow: hidden; color: var(--text-main);
        }

        /* Teacher Toolbar */
        .toolbar {
            position: absolute; top: 0; left: 0; width: 100%; height: 60px;
            background-color: #2d3748; display: flex; align-items: center;
            padding: 0 15px; box-sizing: border-box; z-index: 200; color: white; gap: 10px;
        }
        .tool-btn {
            background-color: #4a5568; color: white; border: 2px solid transparent;
            padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s;
        }
        .tool-btn:hover { background-color: #718096; }
        .tool-btn.active { border-color: #63b3ed; background-color: #2b6cb0; }
        .color-picker { width: 30px; height: 30px; border: none; cursor: pointer; padding: 0; border-radius: 4px;}
        .clear-btn { background-color: #e53e3e; margin-left: auto; }
        .clear-btn:hover { background-color: #c53030; }

        /* Slide Container */
        #presentation-container {
            width: 100%; height: calc(100% - 60px); margin-top: 60px;
            display: flex; justify-content: center; align-items: center; position: relative;
        }
        .slide {
            position: absolute; width: 92%; height: 86%; top: 2%; background: #fff;
            border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 25px 40px; box-sizing: border-box;
            opacity: 0; visibility: hidden; transition: opacity 0.3s ease-in-out;
            display: flex; flex-direction: column; overflow: hidden;
        }
        .slide.active { opacity: 1; visibility: visible; z-index: 10; }

        /* Drawing Canvas */
        .drawing-board {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 50; cursor: crosshair; touch-action: none; border-radius: 12px;
        }

        /* Content Layout */
        .content-layer { position: relative; z-index: 10; width: 100%; height: 100%; display: flex; flex-direction: column; pointer-events: none;}
        .header-title { color: var(--primary); font-size: 1.8em; border-bottom: 3px solid var(--accent); padding-bottom: 8px; margin-top: 0; margin-bottom: 5px;}
        .two-column { display: flex; gap: 25px; flex: 1; min-height: 0; margin-top: 10px; }
        .col { flex: 1; display: flex; flex-direction: column; gap: 12px; }
        .col-write {
            flex: 1.1; background-color: #fafafa; border: 2px dashed #a0aec0; border-radius: 8px; position: relative;
            background-image: linear-gradient(#e2e8f0 1px, transparent 1px), linear-gradient(90deg, #e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .write-label { position: absolute; top: 10px; right: 10px; color: #718096; font-weight: bold; font-style: italic; font-size: 1.1em;}

        /* Typography & Badges */
        h3 { font-size: 1.3em; margin: 3px 0; display: flex; align-items: center; gap: 10px; color: var(--primary);}
        p, li { font-size: 1.15em; line-height: 1.45; margin-top: 4px; margin-bottom: 4px;}
        ul, ol { margin-top: 4px; padding-left: 25px;}
        .badge { color: white; padding: 4px 10px; border-radius: 4px; font-size: 0.65em; text-transform: uppercase; letter-spacing: 1px; }
        .bg-concept { background-color: var(--badge-concept); }
        .bg-activity { background-color: var(--badge-activity); }
        .bg-question { background-color: var(--badge-question); }
        .bg-exit { background-color: var(--badge-exit); }
        .bg-hook { background-color: var(--badge-hook); }
        .content-box { background-color: #f7fafc; border: 1px solid #e2e8f0; padding: 12px 15px; border-radius: 8px; }
        .highlight { background: #fefcbf; padding: 0 4px; border-radius: 3px; font-weight: bold; }

        /* Navigation */
        .nav-panel {
            position: absolute; bottom: 12px; width: 100%; display: flex;
            justify-content: space-between; padding: 0 5%; box-sizing: border-box; z-index: 100; pointer-events: none;
        }
        .nav-btn {
            background-color: var(--primary); color: #fff; border: none; padding: 8px 20px;
            font-size: 1.1em; border-radius: 8px; cursor: pointer; pointer-events: auto;
        }
        .nav-btn:hover { background-color: var(--secondary); }
        .nav-btn:disabled { background-color: #a0aec0; cursor: not-allowed; }
        .progress-indicator { font-size: 1.1em; font-weight: bold; color: #2d3748; align-self: center; pointer-events: auto;}

        /* Title Slide */
        .title-slide .content-layer { justify-content: center; align-items: center; text-align: center; }
        .title-slide h1 { font-size: 3.2em; color: var(--primary); margin-bottom: 10px; }
        .title-slide h2 { font-size: 1.8em; color: var(--text-main); border: none; margin: 5px 0; }

        /* 5E phase colours */
        .b-engage { background: #d69e2e; } .b-explore { background: #38a169; } .b-explain { background: #3182ce; }
        .b-elaborate { background: #805ad5; } .b-evaluate { background: #e53e3e; }
        .tag { color: white; padding: 2px 12px; border-radius: 6px; font-size: 0.75em; vertical-align: middle; }
        .five-e { display: flex; gap: 6px; margin: 10px 0; }
        .five-e span { color: white; padding: 6px 14px; border-radius: 6px; font-weight: bold; font-size: 1.1em; }

        /* ---------- Direct-instruction additions ---------- */
        .p-lec { background: #3182ce; } .p-ido { background: #805ad5; } .p-wedo { background: #dd6b20; }
        .p-youdo { background: #38a169; } .p-rev { background: #e53e3e; }
        .flow { display: flex; gap: 8px; align-items: center; justify-content: center; margin: 12px 0; flex-wrap: wrap; }
        .flow span.chip { color: #fff; padding: 8px 16px; border-radius: 8px; font-weight: bold; font-size: 1.15em; }
        .flow .arrow { font-size: 1.6em; color: #718096; }
        .rule { background: #ebf8ff; border: 3px solid #3182ce; border-radius: 10px; padding: 8px 16px; }
        .rule h3 { margin-bottom: 2px; }
        .rule.purple { background: #faf5ff; border-color: #805ad5; }
        .rule.orange { background: #fffaf0; border-color: #dd6b20; }
        .rule.green { background: #f0fff4; border-color: #38a169; }
        .question { font-size: 1.35em; text-align: center; background: #fefcbf; border-radius: 8px; padding: 6px 10px; font-weight: bold; color: #1a365d; }
        .grid22 { border-collapse: collapse; margin: 2px auto; font-size: 1.12em; }
        .grid22 td { border: 2px solid #805ad5; padding: 4px 16px; min-width: 150px; }
        .grid22 td.h { background: #faf5ff; }
        .steps { display: flex; flex-direction: column; gap: 5px; }
        .stepl { display: flex; gap: 10px; align-items: baseline; font-size: 1.12em; }
        .stepl .n { background: #805ad5; color: #fff; border-radius: 12px; padding: 0 9px; font-size: 0.8em; font-weight: bold; white-space: nowrap; }
        .final { display: inline-block; border: 3px solid #38a169; background: #f0fff4; border-radius: 8px; padding: 2px 12px; line-height: 1.2; vertical-align: middle; }
        .warn { background: #fff5f5; border-left: 6px solid #e53e3e; padding: 6px 12px; border-radius: 6px; }
        .tip { background: #fffff0; border-left: 6px solid #d69e2e; padding: 6px 12px; border-radius: 6px; }
        .step { visibility: hidden; opacity: 0; transition: opacity 0.35s; }
        .step.shown { visibility: visible; opacity: 1; }
        .answer { color: #276749; font-weight: bold; }
        .mini { font-size: 0.95em; }
        .tbl { border-collapse: collapse; width: 100%; font-size: 1.05em; }
        .tbl th, .tbl td { border: 1px solid #cbd5e0; padding: 5px 10px; text-align: left; }
        .tbl th { background: #ebf8ff; color: var(--primary); }
        .slide-timer { font-size: 4.2em; font-weight: bold; color: #276749; text-align: center; font-family: 'Courier New', monospace; line-height: 1.1; }
        .slide-timer.low { color: #c53030; }
        .checklist li { margin: 3px 0; }
        .toolbar select { padding: 6px; border-radius: 5px; font-weight: bold; }
        .timer-box { display: flex; align-items: center; gap: 6px; margin-left: 20px; }
        #tmr { font-family: 'Courier New', monospace; font-size: 1.4em; font-weight: bold; min-width: 80px; text-align: center; }
        .reveal-btn { background-color: #805ad5; }
        .reveal-btn:hover { background-color: #6b46c1; }
    </style>
</head>
<body>

    <!-- Teacher Toolbar -->
    <div class="toolbar">
        <span style="font-weight: bold; font-size: 1.2em; margin-right: 10px;">Teacher Tools:</span>
        <button class="tool-btn active" id="penBtn" onclick="setMode('pen')">✏️ Pen</button>
        <button class="tool-btn" id="eraserBtn" onclick="setMode('eraser')">🧽 Eraser</button>
        <input type="color" id="colorPicker" class="color-picker" value="#000000" onchange="setColor(this.value)" title="Pen colour">
        <select id="jump" onchange="jumpMeeting(this.value)" title="Jump to a meeting">{{JUMP}}</select>
        <div class="timer-box"><span>⏱️</span><span id="tmr">--:--</span><button class="tool-btn" onclick="timerStart()" title="Start">▶</button><button class="tool-btn" onclick="timerPause()" title="Pause">⏸</button><button class="tool-btn" onclick="timerReset()" title="Reset">↺</button></div>
        <button class="tool-btn clear-btn" onclick="clearCanvas()">🗑️ Clear Slide</button>
    </div>

    <div id="presentation-container">

{{SLIDES}}
    </div>

    <!-- Navigation Panel -->
    <div class="nav-panel">
        <button class="nav-btn" id="prevBtn" onclick="changeSlide(-1)">❮ Prev</button>
        <div style="display: flex; gap: 10px; align-items: center; pointer-events: auto;">
            <button class="nav-btn reveal-btn" id="revealBtn" onclick="revealNext()">▼ Reveal step</button>
            <div class="progress-indicator" id="progress">Slide 1</div>
        </div>
        <button class="nav-btn" id="nextBtn" onclick="changeSlide(1)">Next ❯</button>
    </div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const progress = document.getElementById('progress');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const revealBtn = document.getElementById('revealBtn');
        const hiddenSteps = s => [...s.querySelectorAll('.step:not(.shown)')];
        const allSteps = s => [...s.querySelectorAll('.step')];

        function updateNav() {
            const s = slides[currentSlide], tot = allSteps(s).length, left = hiddenSteps(s).length;
            const m = +s.dataset.meeting;
            progress.innerText = `Slide ${currentSlide + 1} of ${slides.length}` + (m ? ` · Meeting ${m}` : '') + (tot ? ` · step ${tot - left}/${tot}` : '');
            prevBtn.disabled = currentSlide === 0;
            nextBtn.disabled = currentSlide === slides.length - 1;
            revealBtn.style.display = left ? 'inline-block' : 'none';
            slides.forEach((slide, index) => slide.classList.toggle('active', index === currentSlide));
            document.getElementById('jump').value = String(m);
            if (!timerRunning && s.dataset.timer) { remaining = +s.dataset.timer * 60; showTime(); }
        }
        function changeSlide(direction) {
            currentSlide = Math.max(0, Math.min(slides.length - 1, currentSlide + direction));
            updateNav();
        }
        function revealNext() { const h = hiddenSteps(slides[currentSlide]); if (h.length) { h[0].classList.add('shown'); updateNav(); return true; } return false; }
        function hideLast() { const s = allSteps(slides[currentSlide]).filter(x => x.classList.contains('shown')); if (s.length) { s[s.length - 1].classList.remove('shown'); updateNav(); } }
        function jumpMeeting(m) { const i = [...slides].findIndex(s => s.dataset.meeting === String(m)); if (i >= 0) { currentSlide = i; updateNav(); } }

        // PowerPoint-style keys (works with presentation clickers): reveal the next step first, then move on
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'SELECT') return;
            if ([' ', 'ArrowRight', 'PageDown', 'Enter'].includes(e.key)) { e.preventDefault(); if (!revealNext()) changeSlide(1); }
            else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); changeSlide(-1); }
            else if (e.key === 'ArrowDown') { e.preventDefault(); revealNext(); }
            else if (e.key === 'ArrowUp') { e.preventDefault(); hideLast(); }
        });

        // ---------- Countdown timer ("You Do" slides set it automatically) ----------
        let remaining = 0, timerRunning = false, timerId = null;
        const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
        function showTime() {
            const t = remaining > 0 || timerRunning || slides[currentSlide].dataset.timer ? fmt(remaining) : '--:--';
            document.getElementById('tmr').textContent = t;
            document.querySelectorAll('.slide-timer').forEach(el => { el.textContent = fmt(slides[currentSlide].contains(el) ? remaining : +el.dataset.min * 60); el.classList.toggle('low', slides[currentSlide].contains(el) && remaining <= 60); });
        }
        function timerStart() { if (timerRunning) return; if (remaining <= 0) remaining = (+slides[currentSlide].dataset.timer || 5) * 60; timerRunning = true; timerId = setInterval(() => { remaining = Math.max(0, remaining - 1); showTime(); if (!remaining) { timerPause(); document.getElementById('tmr').textContent = "⏰ 00:00"; } }, 1000); showTime(); }
        function timerPause() { timerRunning = false; clearInterval(timerId); }
        function timerReset() { timerPause(); remaining = (+slides[currentSlide].dataset.timer || 0) * 60; showTime(); }

        updateNav();

        // --- Canvas Drawing Logic ---
        let currentMode = 'pen';
        let strokeColor = '#000000';
        let strokeWidth = 3;

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('penBtn').classList.remove('active');
            document.getElementById('eraserBtn').classList.remove('active');
            document.getElementById(mode + 'Btn').classList.add('active');
        }

        function setColor(color) {
            strokeColor = color;
            setMode('pen');
        }

        function clearCanvas() {
            const canvas = slides[currentSlide].querySelector('canvas');
            if (canvas) {
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        function resizeCanvases() {
            slides.forEach(slide => {
                const canvas = slide.querySelector('canvas');
                if (canvas) {
                    canvas.width = canvas.offsetWidth;
                    canvas.height = canvas.offsetHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                }
            });
        }

        slides.forEach(slide => {
            const canvas = slide.querySelector('canvas');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            let isDrawing = false;

            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            }

            function startDraw(e) {
                isDrawing = true;
                const pos = getPos(e);
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            }

            function draw(e) {
                if (!isDrawing) return;
                e.preventDefault();

                const pos = getPos(e);

                if (currentMode === 'eraser') {
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.lineWidth = 20;
                } else {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = strokeColor;
                    ctx.lineWidth = strokeWidth;
                }

                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            }

            function stopDraw() {
                isDrawing = false;
                ctx.closePath();
            }

            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDraw);
            canvas.addEventListener('mouseout', stopDraw);

            canvas.addEventListener('touchstart', startDraw, {passive: false});
            canvas.addEventListener('touchmove', draw, {passive: false});
            canvas.addEventListener('touchend', stopDraw);
        });

        window.onload = resizeCanvases;
        window.onresize = resizeCanvases;
    </script>
</body>
</html>
