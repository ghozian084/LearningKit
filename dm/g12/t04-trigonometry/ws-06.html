            const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
            const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: fromB64(DATA.salt), iterations: DATA.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
            const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(DATA.iv) }, key, fromB64(DATA.ct));
            return new TextDecoder().decode(plain);
        }
        function show(html) { document.open(); document.write(html); document.close(); }
        const form = document.getElementById('lockForm'), msg = document.getElementById('msg'), btn = document.getElementById('unlockBtn');
        if (!window.crypto || !crypto.subtle) {
            msg.className = 'msg err'; msg.textContent = 'This browser cannot unlock the file. Please open it via https:// or from a local file in Chrome/Edge/Firefox.';
            btn.disabled = true;
        }
        form.addEventListener('submit', async e => {
            e.preventDefault();
            const pw = document.getElementById('pw').value;
            if (!pw) return;
            btn.disabled = true; msg.className = 'msg'; msg.textContent = 'Unlocking…';
            try {
                const html = await unlock(pw);
                try { sessionStorage.setItem('lk-pw', pw); } catch (_) {}
                show(html);
            } catch (_) {
                msg.className = 'msg err'; msg.textContent = '❌ Wrong password. Try again.';
                btn.disabled = false; document.getElementById('pw').select();
            }
        });
        // Teacher convenience: stay unlocked for this browser tab session (e.g. after a refresh).
        (async () => {
            let saved = null;
            try { saved = sessionStorage.getItem('lk-pw'); } catch (_) {}
            if (saved && window.crypto && crypto.subtle) { try { show(await unlock(saved)); } catch (_) {} }
        })();
    </script>
</body>
</html>
